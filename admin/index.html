      el('td', { class: 'mute', text: p.clan }), el('td', { class: 'num', text: p.sessions }),
      el('td', {}, p.banned ? pill('banned', 'p-bad') : p.inBattle ? pill('in battle', 'p-warn') : p.online ? pill('online', 'p-good') : null))))));
}
function playersView(kind) {

    el('tbody', {}, list.map((p) => el('tr', {}, el('td', { class: 'mute', text: p.tag }), el('td', { text: p.name || '(no name)' }), el('td', { text: p.ban.reason || '—' }), el('td', { text: p.ban.until ? new Date(p.ban.until * 1000).toLocaleString() : 'never' }), el('td', { class: 'mute', text: p.ban.by || '' }),

}

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function newsView() {
  const j = await api('news'); let editing = null;

        el('button', { class: 'danger', text: 'Delete', onclick: async () => { if (!confirm('Delete "' + p.title + '"?')) return; try { draw((await api('news', { delete: p.id })).posts); toast('Deleted'); } catch (e) { toast(e.message); } } })] : null),

    el('h2', { class: 'sec', style: 'margin-top:26px', text: 'Published posts' }), list);

// ---- Game settings (emotes, free chat) ----
async function gameView() {
  const s = await api('settings');
  const fc = el('input', { type: 'checkbox' }); fc.checked = s.freeChat;
  const names = { 1: 'Emote 1', 2: 'Emote 2', 3: 'Emote 3', 4: 'Emote 4', 5: 'Emote 5', 6: 'Emote 6' };
  const inputs = {};
  const grid = el('div', { class: 'emotes' }, Object.keys(s.defaults).map((k) => { inputs[k] = el('input', { value: s.emotes[k] || '', placeholder: s.defaults[k], maxlength: 40 });
    return el('label', { class: 'emote' }, el('small', { text: names[k] + ' (default: ' + s.defaults[k] + ')' }), inputs[k]); }));
  const save = el('button', { class: 'gold', text: 'Save' });
  save.onclick = async () => { try { const emotes = {}; for (const k in inputs) emotes[k] = inputs[k].value; await api('settings', { freeChat: fc.checked, emotes }); toast('Saved. Players get it the next time they load the game.'); } catch (e) { toast(e.message); } };

    el('h2', { class: 'sec' }, el('img', { src: ADMIN_API + '/static/cards.webp', alt: '' }), 'Game settings'),

      el('label', { class: 'switch' }, fc, el('div', {}, el('b', { text: 'Free chat in battles' }), el('div', { class: 'note', text: 'Players can type messages to their opponent during a match (press Enter, or the chat button). Bad words are starred out; mute people in the Chat tab.' })))),
    el('div', { class: 'card pad' }, el('b', { text: 'Emote texts' }), el('p', { class: 'note', text: 'What the 6 emote buttons say in battle. Leave a box empty to keep the original text. Up to 40 characters.' }), el('div', { style: 'height:10px' }), grid),
    el('div', { class: 'row', style: 'margin-top:14px' }, save));
}
// ---- Battle chat log ----
async function chatView() {
  const j = await api('chat'); const muted = new Set(j.muted);
  const rows = j.chat;
  const table = rows.length ? el('div', { class: 'scroll' }, el('table', {}, el('thead', {}, el('tr', {}, ['When (UTC)', 'From', 'To', 'Message', ''].map((h) => el('th', { text: h })))),
    el('tbody', {}, rows.map((r) => el('tr', {}, el('td', { class: 'mute', text: r.time }), el('td', { text: r.name }), el('td', { class: 'mute', text: r.to }), el('td', { style: 'white-space:normal', text: r.text }),
      el('td', {}, el('button', { class: muted.has(r.id) ? 'good' : 'danger', text: muted.has(r.id) ? 'Unmute' : 'Mute', onclick: async () => { try { await api('mute', { id: r.id, muted: !muted.has(r.id) }); toast((muted.has(r.id) ? 'Unmuted ' : 'Muted ') + r.name); chatView(); } catch (e) { toast(e.message); } } }))))))) : el('div', { class: 'empty', text: 'No battle chat yet' });
  $('#main').replaceChildren(el('h2', { class: 'sec' }, el('img', { src: ADMIN_API + '/static/xp.webp', alt: '' }), 'Battle chat'),
    el('p', { class: 'note', text: 'The latest free-chat messages from matches. Muted players can still play but cannot send messages.' + (muted.size ? ' Muted: ' + muted.size + '.' : '') }),
    el('div', { class: 'row', style: 'margin:10px 0' }, el('button', { text: 'Refresh', onclick: chatView })), el('div', { class: 'card' }, table));

async function render() {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === state.tab));
  try {
    if (state.tab === 'overview') await overview();
    else if (state.tab === 'news') await newsView();
    else if (state.tab === 'game') await gameView();
    else if (state.tab === 'chat') await chatView();
    else if (state.tab === 'audit') { const j = await api('audit'); $('#main').replaceChildren(el('div', { class: 'card' }, auditTable(j.audit))); }
    else { if (!state.players.length) await loadPlayers(); playersView(state.tab); }
  } catch (e) { $('#who').textContent = e.message; $('#main').replaceChildren(el('div', { class: 'empty', text: token() ? e.message : 'Sign in at webroyale.dev/login first, then reload this page.' })); }
}
$('#tabs').onclick = (e) => { const t = e.target.closest('button')?.dataset.t; if (t) { state.tab = t; render(); } };
$('#dlg').addEventListener('click', (e) => { if (e.target === $('#dlg')) $('#dlg').close(); });
(async () => { if (!token()) { $('#who').textContent = 'Not signed in'; } try { await loadPlayers(); } catch (e) { $('#who').textContent = e.message; } render(); setInterval(() => { if (!$('#dlg').open && ['overview', 'players', 'online', 'bans'].includes(state.tab) && !(document.activeElement && document.activeElement.tagName === 'INPUT')) { loadPlayers().then(render).catch(() => {}); } }, 15000); })();
</script>
