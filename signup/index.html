<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up – WebRoyale</title>
<meta name="description" content="Create a free WebRoyale account to play OG Clash Royale in your browser.">
<link rel="canonical" href="https://webroyale.dev/signup/">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0a1628">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="/"><img src="/assets/img/icons/blue.webp" width="38" height="28" alt="">WebRoyale</a>
  <span class="spacer"></span>
  <a class="btn sm gold" href="/play/">Play</a>
</div></header>
<main class="center">
  <form class="card" id="f" novalidate>
    <div class="banner" id="banner">Sign up</div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tLogin" aria-selected="false">Login</button>
      <button type="button" role="tab" id="tSignup" aria-selected="false">Sign up</button>
    </div>
    <p class="hint" id="why" style="margin:0 0 14px;display:none">Log in to play. It only takes a moment.</p>
    <div class="field"><label for="u">Username</label><input id="u" name="u" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="32" required></div>
    <div class="field"><label for="p">Password</label><input id="p" name="p" type="password" autocomplete="current-password" required></div>
    <div class="field" id="p2box" hidden><label for="p2">Confirm password</label><input id="p2" type="password" autocomplete="new-password"></div>
    <div id="cf" style="display:flex;justify-content:center;margin:4px 0 14px;min-height:65px"></div>
    <button class="btn gold" id="go" type="submit">Log in</button>
    <p class="msg" id="msg" role="status"></p>
    <p class="hint">Your WebRoyale account is a SillyOS account: the same username and password work on both. Your in-game name is your username.</p>
  </form>
</main>
<script src="/config.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="/assets/site.js"></script>
<script>
  const qs = new URLSearchParams(location.search), next = WR.safeNext(qs.get('next'));
  let mode = location.pathname.startsWith('/signup') ? 'signup' : 'login';
  const $ = (id) => document.getElementById(id), msg = $('msg');
  if (qs.get('next') === '/play/') $('why').style.display = '';
  if (qs.has('expired')) { msg.className = 'msg err'; msg.textContent = 'Your session expired. Please log in again.'; }
  if (WR.token() && !qs.has('expired')) location.replace(next);
  // Turnstile is drawn explicitly once the form is visible (drawing it inside a hidden box leaves no widget).
  let cfId = null;
  function renderCf() {
    if (cfId !== null) { try { window.turnstile.reset(cfId); } catch (e) {} return; }
    if (!window.turnstile) { setTimeout(renderCf, 300); return; }
    cfId = window.turnstile.render('#cf', { sitekey: '0x4AAAAAAGIdp0W5ZNzVCk9A', theme: 'dark' });
  }
  function setMode(m) {
    mode = m; const su = m === 'signup';
    $('tLogin').setAttribute('aria-selected', !su); $('tSignup').setAttribute('aria-selected', su);
    $('banner').textContent = su ? 'Sign up' : 'Login'; $('go').textContent = su ? 'Create account' : 'Login';
    $('p2box').hidden = !su; renderCf(); $('p').autocomplete = su ? 'new-password' : 'current-password';
    document.title = (su ? 'Sign up' : 'Login') + ' – WebRoyale';
    history.replaceState(null, '', (su ? '/signup/' : '/login/') + location.search);
  }
  $('tLogin').onclick = () => setMode('login'); $('tSignup').onclick = () => setMode('signup');
  setMode(mode);
  // Signup check: find n so that SHA-256("<challenge>:<n>") starts with the required number of zero bits (see bridge POW_BITS).
  async function solvePow() {
    const ch = await (await fetch(WR.API + '/bridge/register/challenge', { cache: 'no-store' })).json();
    const enc = new TextEncoder(), full = Math.floor(ch.d / 8), rest = ch.d % 8;
    for (let n = 0; ; n++) {
      const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(ch.c + ':' + n)));
      let ok = true; for (let i = 0; i < full && ok; i++) if (h[i] !== 0) ok = false;
      if (ok && rest && (h[full] >> (8 - rest)) !== 0) ok = false;
      if (ok) return { c: ch.c, t: ch.t, s: ch.s, n: String(n) };
    }
  }
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    const u = $('u').value.trim(), p = $('p').value;
    const err = (t) => { msg.className = 'msg err'; msg.textContent = t; };
    if (!u || !p) return err('Enter a username and password');
    if (mode === 'signup' && p !== $('p2').value) return err('The passwords don’t match');
    $('go').disabled = true; msg.className = 'msg'; msg.textContent = mode === 'signup' ? 'Creating your account…' : 'Logging in…';
    try {
      const tok = window.turnstile && cfId !== null ? window.turnstile.getResponse(cfId) : '';
      if (!tok) { $('go').disabled = false; return err(cfId === null ? 'The check is still loading. Try again in a moment.' : 'Please complete the check first'); }
      let body = { username: u, password: p, turnstile: tok };
      if (mode === 'signup') { msg.className = 'msg'; msg.textContent = 'Creating your account…'; body.pow = await solvePow(); }
      const r = await WR.bridge(mode === 'signup' ? '/register' : '/login', body);
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.token) { $('go').disabled = false; if (window.turnstile && cfId !== null) window.turnstile.reset(cfId); return err(j.error || 'Something went wrong'); }
      WR.setToken(j.token); WR.setUser(u.toLowerCase());
      msg.className = 'msg ok'; msg.textContent = 'Welcome, ' + u + '!';
      location.replace(next);
    } catch (x) { $('go').disabled = false; err('Could not reach the server. Try again.'); }
  };
</script>
</body>
</html>
